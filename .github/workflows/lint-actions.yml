name: Lint Actions

on:
  workflow_call:
  workflow_dispatch:

permissions: {}

jobs:
  lint-actions:
    name: Lint Actions
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 5
    permissions:
      security-events: write # Required for upload-sarif to upload SARIF files.
    concurrency:
      group: lint-actions-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Environment
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: 2026.10.21
          install_args: zizmor jactionlint shellcheck

      - parallel:
          - name: Run zizmor 🌈
            run: |
              zizmor . --pedantic --color=always --format=sarif > zizmor.sarif
            env:
              ZIZMOR_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          - name: Run jactionlint
            continue-on-error: true
            run: |
              jactionlint --format sarif > jactionlint.sarif

      - parallel:
          - name: Upload zizmor SARIF file
            uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
            with:
              sarif_file: zizmor.sarif
              category: zizmor

          - name: Upload jactionlint SARIF file
            uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
            with:
              sarif_file: jactionlint.sarif
              category: jactionlint
