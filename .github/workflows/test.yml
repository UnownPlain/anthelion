name: Test

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      packages:
        description: Package IDs to test (space-separated)
        required: false
        type: string
      komac-run-url:
        description: Optional komac Actions run URL to test Node bindings from
        required: false
        type: string

permissions: {}

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  detect-changes:
    name: Detect Changed Shards
    if: ${{ !inputs.packages }}
    runs-on: ubuntu-slim
    timeout-minutes: 1
    concurrency:
      group: test-detect-changes-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    outputs:
      any_changed: ${{ steps.changed-files.outputs.any_changed }}
      changed_files: ${{ steps.changed-files.outputs.all_changed_files }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Get Changed Files
        id: changed-files
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          json: true
          escape_json: false
          files: shards/**
          files_ignore: |
            shards/**/*.disabled
            shards/auto-remove.json

  test:
    name: Test
    needs: detect-changes
    if: always() && (needs.detect-changes.outputs.any_changed == 'true' || inputs.packages)
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 20
    concurrency:
      group: test-job-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Environment
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: 2026.11.3
          install_args: bun

      - name: Install Dependencies
        run: bun ci --production

      - name: Install Komac Node Bindings from Run
        if: ${{ inputs.komac-run-url != '' }}
        run: |
          if [[ "$KOMAC_RUN_URL" =~ ^https://github\.com/unpn-org/Komac/actions/runs/([0-9]+)/?$ ]]; then
            run_id="${BASH_REMATCH[1]}"
          else
            echo '::error::Expected a run URL like https://github.com/unpn-org/Komac/actions/runs/42461657593'
            exit 1
          fi

          platform="$(bun -p 'process.platform')"
          arch="$(bun -p 'process.arch')"
          case "$arch" in
            x64) target_arch=x86_64 ;;
            arm64) target_arch=aarch64 ;;
            *) echo "::error::Unsupported architecture: $arch"; exit 1 ;;
          esac
          case "$platform" in
            linux)
              libc="$(bun -p 'process.report.getReport().header.glibcVersionRuntime ? "gnu" : "musl"')"
              target="$target_arch-unknown-linux-$libc"
              ;;
            darwin) target="$target_arch-apple-darwin" ;;
            win32) target="$target_arch-pc-windows-msvc" ;;
            *) echo "::error::Unsupported platform: $platform"; exit 1 ;;
          esac

          artifact_dir="$RUNNER_TEMP/komac-bindings"
          gh run download "$run_id" --repo unpn-org/Komac \
            --name "bindings-$target" --dir "$artifact_dir"

          shopt -s nullglob
          bindings=("$artifact_dir"/*.node)
          if [[ "${#bindings[@]}" != 1 ]]; then
            echo '::error::Expected exactly one native binding in the artifact'
            exit 1
          fi
          binding="$(basename "${bindings[0]}")"
          for file in index.js index.d.ts "$binding"; do
            test -s "$artifact_dir/$file"
          done

          package_dir="$GITHUB_WORKSPACE/node_modules/@unownplain/anthelion-komac"
          cp "$artifact_dir/index.js" "$artifact_dir/index.d.ts" "$artifact_dir/$binding" "$package_dir/"
          # Force the selected binary so a load failure cannot fall back to npm.
          echo "NAPI_RS_NATIVE_LIBRARY_PATH=$package_dir/$binding" >> "$GITHUB_ENV"
        env:
          KOMAC_RUN_URL: ${{ inputs.komac-run-url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Test Packages
        run: |
          if [ -n "$PACKAGES" ]; then
            PACKAGE_IDS="$PACKAGES"
          else
            PACKAGE_IDS=""
            while IFS= read -r file; do
              SHARD_NAME="$(basename "${file%.*}")"
              PACKAGE_IDS+="${SHARD_NAME%.Font} "
            done < <(jq -r '.[]' <<< "$CHANGED_FILES")
            PACKAGE_IDS="${PACKAGE_IDS% }"
          fi

          bun test:shard "$PACKAGE_IDS" --dry-run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHANGED_FILES: ${{ needs.detect-changes.outputs.changed_files }}
          PACKAGES: ${{ inputs.packages }}
