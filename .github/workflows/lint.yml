name: Lint Project

on:
  workflow_call:
  workflow_dispatch:

permissions: {}

jobs:
  lint-project:
    name: Lint Project
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 5
    concurrency:
      group: lint-project-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Environment
        uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
        with:
          version: 2026.9.18
          install_args: bun

      - name: Install Dependencies
        run: bun ci

      - parallel:
          - name: Check Formatting
            run: bun fmt --check

          - name: Lint & Type check
            run: bun lint --deny-warnings

          - name: Run Tests
            run: bun test:unit

          - name: Build Package
            run: bun build:ext
