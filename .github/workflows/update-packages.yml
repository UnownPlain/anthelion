name: Update Packages

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions: {}

jobs:
  update-packages:
    name: Update Packages
    runs-on: ubuntu-26.04-arm
    environment:
      name: Production
      deployment: false
    timeout-minutes: 20
    permissions:
      id-token: write # Required to authenticate to Infisical with GitHub OIDC.
    env:
      INFISICAL_IDENTITY_ID: ${{ vars.INFISICAL_IDENTITY_ID }}
      INFISICAL_PROJECT_ID: ${{ vars.INFISICAL_PROJECT_ID }}
      INFISICAL_ENVIRONMENT: ${{ vars.INFISICAL_ENVIRONMENT }}
      INFISICAL_DOMAIN: ${{ vars.INFISICAL_DOMAIN }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Environment
        uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          version: 2026.10.25
          install_args: bun codex infisical

      - parallel:
          - name: Install Dependencies
            run: bun ci --production

          - name: Restore Credentials
            id: credentials
            run: bash .github/scripts/infisical.sh restore

      - name: Update Packages
        run: bun start
        env:
          KOMAC_FORK_OWNER: ${{ github.repository_owner }}

      - name: Save Refreshed Credentials
        if: always() && steps.credentials.outcome == 'success'
        run: bash .github/scripts/infisical.sh save
